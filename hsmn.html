<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thần Đồng Siêu Nhí - Cổng Học Sinh & Phụ Huynh</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFF7ED; }
        .mobile-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FFFBF5; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: relative; }
    </style>
</head>
<body class="text-gray-800">

    <div class="mobile-container">
        
        <!-- HEADER THÔNG TIN HỌC SINH -->
        <header class="bg-gradient-to-r from-orange-500 to-emerald-600 text-white p-5 rounded-b-[30px] shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-3">
                    <div class="bg-white/20 p-2.5 rounded-2xl text-xl backdrop-blur-sm">
                        <i class="fa-solid fa-child-reaching text-emerald-300"></i>
                    </div>
                    <div>
                        <h1 id="student-name-display" class="font-black text-lg leading-tight">Đang tải...</h1>
                        <p class="text-xs text-orange-100 font-semibold" id="student-code-display">Mã: ---</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition backdrop-blur-sm">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
                </button>
            </div>

            <!-- MENU TAB ĐIỀU HƯỚNG DI ĐỘNG (5 CHỨC NĂNG) -->
            <div class="grid grid-cols-5 gap-1 pt-2 border-t border-white/20 text-center">
                <button onclick="switchTab('profile')" id="tab-btn-profile" class="py-2 px-0.5 rounded-xl text-[10px] font-bold bg-white text-orange-600 shadow-sm transition">
                    <i class="fa-solid fa-id-card block mb-0.5 text-xs"></i> Hồ Sơ
                </button>
                <button onclick="switchTab('blog')" id="tab-btn-blog" class="py-2 px-0.5 rounded-xl text-[10px] font-bold text-white/90 hover:bg-white/20 transition">
                    <i class="fa-solid fa-bullhorn block mb-0.5 text-xs"></i> Tin Tức
                </button>
                <button onclick="switchTab('attendance')" id="tab-btn-attendance" class="py-2 px-0.5 rounded-xl text-[10px] font-bold text-white/90 hover:bg-white/20 transition">
                    <i class="fa-solid fa-calendar-check block mb-0.5 text-xs"></i> Điểm Danh
                </button>
                <button onclick="switchTab('tuition')" id="tab-btn-tuition" class="py-2 px-0.5 rounded-xl text-[10px] font-bold text-white/90 hover:bg-white/20 transition">
                    <i class="fa-solid fa-file-invoice-dollar block mb-0.5 text-xs"></i> Học Phí
                </button>
                <button onclick="switchTab('english')" id="tab-btn-english" class="py-2 px-0.5 rounded-xl text-[10px] font-bold text-white/90 hover:bg-white/20 transition">
                    <i class="fa-solid fa-headphones block mb-0.5 text-xs"></i> Tiếng Anh
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT CONTAINER -->
        <main class="flex-1 p-4 space-y-4 overflow-y-auto pb-20" id="main-content">
            <!-- Dữ liệu render động bằng JS -->
        </main>

        <!-- FOOTER COPYRIGHT -->
        <footer class="py-3 text-center text-[10px] text-gray-400 border-t border-orange-100 bg-white/60">
            Hệ thống Quản lý Mầm Non Thần Đồng Siêu Nhí
        </footer>
    </div>

<script>
    let currentStudent = null;
    let appDatabase = {};

    window.onload = function() {
        const storedUser = localStorage.getItem('currentUser');
        appDatabase = JSON.parse(localStorage.getItem('than_dong_sieu_nhi_db')) || {};
        
        // Chuyển đổi linh hoạt nếu students là Object hoặc Array
        let rawStudents = appDatabase.students || [];
        const studentsList = Array.isArray(rawStudents) ? rawStudents : Object.values(rawStudents);

        if (!storedUser) {
            alert("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại!");
            window.location.href = 'index.html';
            return;
        }

        const parsedUser = JSON.parse(storedUser);

        // Lọc chính xác học sinh từ database của admin theo email hoặc mã code hoặc tên
        let matchedStudent = null;
        if (parsedUser.email) {
            matchedStudent = studentsList.find(s => s.email && s.email.trim().toLowerCase() === parsedUser.email.trim().toLowerCase());
        }
        if (!matchedStudent && parsedUser.code) {
            matchedStudent = studentsList.find(s => s.code && s.code.trim() === parsedUser.code.trim());
        }
        if (!matchedStudent && parsedUser.name) {
            matchedStudent = studentsList.find(s => s.name && s.name.trim().toLowerCase() === parsedUser.name.trim().toLowerCase());
        }

        if (matchedStudent) {
            currentStudent = matchedStudent;
        } else {
            currentStudent = parsedUser;
        }

        // Cập nhật lại session chính xác tuyệt đối theo đúng cá nhân học sinh đó
        localStorage.setItem('currentUser', JSON.stringify(currentStudent));

        updateHeaderInfo();
        switchTab('profile');
    };

    function updateHeaderInfo() {
        if (currentStudent) {
            document.getElementById('student-name-display').innerText = currentStudent.name || 'Bé Yêu';
            document.getElementById('student-code-display').innerText = `Mã: ${currentStudent.code || '---'}`;
        }
    }

    function switchTab(tabKey) {
        ['profile', 'blog', 'attendance', 'tuition', 'english'].forEach(t => {
            const btn = document.getElementById(`tab-btn-${t}`);
            if (t === tabKey) {
                btn.className = "py-2 px-0.5 rounded-xl text-[10px] font-extrabold bg-white text-orange-600 shadow-md transition transform scale-105";
            } else {
                btn.className = "py-2 px-0.5 rounded-xl text-[10px] font-bold text-white/90 hover:bg-white/20 transition";
            }
        });

        const container = document.getElementById('main-content');
        appDatabase = JSON.parse(localStorage.getItem('than_dong_sieu_nhi_db')) || {};

        let rawStudents = appDatabase.students || [];
        const studentsList = Array.isArray(rawStudents) ? rawStudents : Object.values(rawStudents);
        
        let freshStudent = null;
        if (currentStudent.email) {
            freshStudent = studentsList.find(s => s.email && s.email.trim().toLowerCase() === currentStudent.email.trim().toLowerCase());
        }
        if (!freshStudent && currentStudent.code) {
            freshStudent = studentsList.find(s => s.code && s.code.trim() === currentStudent.code.trim());
        }

        if (freshStudent) {
            currentStudent = freshStudent;
            localStorage.setItem('currentUser', JSON.stringify(currentStudent));
            updateHeaderInfo();
        }

        if (tabKey === 'profile') renderProfileTab(container);
        else if (tabKey === 'blog') renderBlogTab(container);
        else if (tabKey === 'attendance') renderAttendanceTab(container);
        else if (tabKey === 'tuition') renderTuitionTab(container);
        else if (tabKey === 'english') renderEnglishTab(container);
    }

    // --- 1. TAB THÔNG TIN CÁ NHÂN & ĐỔI MẬT KHẨU ---
    function renderProfileTab(container) {
        const classesList = appDatabase.classesList || [];
        const assignedClass = classesList.find(c => 
            currentStudent.className === c.name || currentStudent.className === `${c.name} (${c.code})`
        );
        const classNameDisplay = assignedClass ? assignedClass.name : (currentStudent.className || 'Chưa xếp lớp');

        let teacherName = 'Đang cập nhật';
        let teacherPhone = '---';
        if (assignedClass && assignedClass.teachers && assignedClass.teachers.length > 0) {
            const teachers = appDatabase.teachers || [];
            const foundTeacher = teachers.find(t => t.name === assignedClass.teachers[0] || t.code === assignedClass.teachers[0]);
            if (foundTeacher) {
                teacherName = foundTeacher.name;
                teacherPhone = foundTeacher.phone || '---';
            } else {
                teacherName = assignedClass.teachers.join(', ');
            }
        }

        let contractNo = '---';
        let admissionDate = '---';
        if (currentStudent.contracts && currentStudent.contracts.length > 0) {
            contractNo = currentStudent.contracts[0].no || '---';
            admissionDate = currentStudent.contracts[0].signedDate || currentStudent.contracts[0].from || '---';
        }

        let familyHtml = '';
        if (currentStudent.family && currentStudent.family.length > 0) {
            familyHtml = currentStudent.family.map(f => `
                <div class="flex justify-between items-center py-1 border-b border-amber-100/60 last:border-none">
                    <span class="font-semibold text-gray-700">${f.relation} - ${f.name || '---'}:</span> 
                    <span class="font-mono text-emerald-700 font-bold">${f.phone || '---'}</span>
                </div>
            `).join('');
        } else {
            familyHtml = `<p>Thông tin phụ huynh chưa được cập nhật.</p>`;
        }

        container.innerHTML = `
            <div class="space-y-4">
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-orange-100 space-y-3">
                    <div class="flex items-center space-x-3 border-b border-orange-100 pb-2.5">
                        <div class="bg-orange-100 text-orange-600 h-10 w-10 rounded-2xl flex items-center justify-center font-bold text-lg shadow-xs">
                            <i class="fa-solid fa-child"></i>
                        </div>
                        <div>
                            <h2 class="font-black text-sm text-gray-800">${currentStudent.name || 'Bé Yêu'}</h2>
                            <p class="text-[11px] text-orange-600 font-bold">Học sinh trường Mầm non Thần Đồng</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-orange-50/50 p-2.5 rounded-2xl border border-orange-100">
                            <span class="text-[10px] text-gray-400 font-bold block">Ngày sinh</span>
                            <b class="text-gray-800">${currentStudent.dob || '---'}</b>
                        </div>
                        <div class="bg-orange-50/50 p-2.5 rounded-2xl border border-orange-100">
                            <span class="text-[10px] text-gray-400 font-bold block">Giới tính</span>
                            <b class="text-gray-800">${currentStudent.gender || '---'}</b>
                        </div>
                        <div class="bg-orange-50/50 p-2.5 rounded-2xl border border-orange-100">
                            <span class="text-[10px] text-gray-400 font-bold block">Số hợp đồng</span>
                            <b class="text-orange-700">${contractNo}</b>
                        </div>
                        <div class="bg-orange-50/50 p-2.5 rounded-2xl border border-orange-100">
                            <span class="text-[10px] text-gray-400 font-bold block">Ngày nhập học</span>
                            <b class="text-emerald-700">${admissionDate}</b>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-3xl shadow-sm border border-orange-100 space-y-3 text-xs">
                    <h3 class="font-black text-orange-600 uppercase text-[11px]"><i class="fa-solid fa-lock mr-1"></i> Tài Khoản & Bảo Mật</h3>
                    <div class="bg-orange-50/50 p-3 rounded-2xl border border-orange-100 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-500">Email đăng nhập:</span>
                            <b class="font-mono text-teal-700">${currentStudent.email || '---'}</b>
                        </div>
                        <div class="pt-2 border-t border-orange-200/50 space-y-2">
                            <label class="block font-bold text-gray-700">Đổi mật khẩu mới:</label>
                            <div class="flex space-x-2">
                                <input type="password" id="new-password-input" placeholder="Mật khẩu mới..." class="p-2 border border-orange-200 rounded-xl text-xs flex-1 bg-white focus:outline-none focus:ring-1 focus:ring-orange-500">
                                <button onclick="changePasswordSystem()" class="bg-orange-600 hover:bg-orange-700 text-white px-3 py-2 rounded-xl font-bold transition">Cập nhật</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-3xl shadow-sm border border-orange-100 space-y-2 text-xs">
                    <h3 class="font-black text-orange-600 uppercase text-[11px]"><i class="fa-solid fa-users mr-1"></i> Thông Tin Gia Đình</h3>
                    <div class="bg-amber-50/50 p-3 rounded-2xl border border-amber-100 space-y-1">
                        ${familyHtml}
                    </div>
                </div>

                <div class="bg-white p-4 rounded-3xl shadow-sm border border-emerald-100 space-y-2 text-xs">
                    <h3 class="font-black text-emerald-600 uppercase text-[11px]"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Thông Tin Dị Ứng & Sức Khỏe</h3>
                    <div class="bg-emerald-50/50 p-3 rounded-2xl border border-emerald-100">
                        <p class="text-emerald-900 font-semibold">${currentStudent.allergy || currentStudent.allergies || currentStudent.note || 'Không có ghi chú dị ứng đặc biệt.'}</p>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-3xl shadow-sm border border-orange-100 space-y-2 text-xs">
                    <h3 class="font-black text-orange-600 uppercase text-[11px]"><i class="fa-solid fa-school mr-1"></i> Lớp Học & Giáo Viên Chủ Nhiệm</h3>
                    <div class="bg-orange-50/50 p-3 rounded-2xl border border-orange-100 space-y-1">
                        <p>Lớp học hiện tại: <b class="text-orange-700 text-sm">${classNameDisplay}</b></p>
                        <p>Giáo viên chủ nhiệm: <b>${teacherName}</b></p>
                        <p>SĐT giáo viên: <b class="font-mono text-emerald-700">${teacherPhone}</b></p>
                    </div>
                </div>
            </div>
        `;
    }

    function changePasswordSystem() {
        const newPass = document.getElementById('new-password-input').value.trim();
        if (!newPass) {
            alert("Vui lòng nhập mật khẩu mới!");
            return;
        }

        currentStudent.pass = newPass;
        
        let rawStudents = appDatabase.students || [];
        if (Array.isArray(rawStudents)) {
            const idx = rawStudents.findIndex(s => (s.code && currentStudent.code && s.code === currentStudent.code) || (s.email && currentStudent.email && s.email === currentStudent.email));
            if (idx !== -1) {
                appDatabase.students[idx].pass = newPass;
            }
        } else {
            for (let key in rawStudents) {
                if (rawStudents[key].code === currentStudent.code || rawStudents[key].email === currentStudent.email) {
                    appDatabase.students[key].pass = newPass;
                }
            }
        }
        
        localStorage.setItem('than_dong_sieu_nhi_db', JSON.stringify(appDatabase));
        localStorage.setItem('currentUser', JSON.stringify(currentStudent));

        alert("🎉 Đổi mật khẩu thành công! Hệ thống đã đồng bộ.");
        document.getElementById('new-password-input').value = '';
    }

    // --- 2. TAB TIN TỨC & THÔNG BÁO ---
    function renderBlogTab(container) {
        let rawPosts = appDatabase.postsList || appDatabase.blogs || [];
        const posts = Array.isArray(rawPosts) ? rawPosts : Object.values(rawPosts);

        container.innerHTML = `
            <div class="space-y-3">
                <h2 class="font-extrabold text-xs text-gray-700 uppercase tracking-wide"><i class="fa-solid fa-bullhorn mr-1 text-orange-500"></i> Bảng Tin & Thông Báo Từ Nhà Trường</h2>
                <div class="space-y-3">
                    ${posts.length > 0 ? posts.map(p => {
                        let contentBlocksHtml = '';
                        if (p.contentBlocks && p.contentBlocks.length > 0) {
                            contentBlocksHtml = p.contentBlocks.map(b => {
                                if (b.type === 'text') return `<p class="text-xs text-gray-600 leading-relaxed">${b.value}</p>`;
                                if (b.type === 'image') return `<div class="my-2"><img src="${b.url}" class="rounded-xl max-h-48 w-full object-cover"><p class="text-[10px] italic text-gray-400 mt-1">${b.caption || ''}</p></div>`;
                                return '';
                            }).join('');
                        } else {
                            contentBlocksHtml = `<p class="text-xs text-gray-600 leading-relaxed">${p.content || p.desc || ''}</p>`;
                        }

                        return `
                            <div class="bg-white p-4 rounded-3xl shadow-sm border border-orange-100 space-y-2">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-extrabold text-xs text-orange-700 leading-snug">${p.title || p.subject || 'Thông báo mới'}</h3>
                                    <span class="text-[10px] text-gray-400 bg-orange-50 px-2 py-0.5 rounded-full font-mono shrink-0">${p.postDate || p.date || ''}</span>
                                </div>
                                <div class="space-y-1">${contentBlocksHtml}</div>
                            </div>
                        `;
                    }).join('') : '<div class="bg-white p-6 rounded-3xl text-center text-xs text-gray-400 border border-orange-100">Chưa có thông báo nào từ nhà trường.</div>'}
                </div>
            </div>
        `;
    }

    // --- 3. TAB ĐIỂM DANH ---
    function renderAttendanceTab(container) {
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth() + 1;
        const monthPrefix = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;

        let rawRecords = appDatabase.attendanceRecords || [];
        const recordsList = Array.isArray(rawRecords) ? rawRecords : Object.values(rawRecords);

        const records = recordsList.filter(r => 
            r.date && r.date.startsWith(monthPrefix) && 
            (r.studentCode === currentStudent.code || r.studentName === currentStudent.name) &&
            (r.status === 'Present' || r.status === 'present' || r.present === true)
        );

        container.innerHTML = `
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 space-y-4 text-center">
                <div class="bg-emerald-100 text-emerald-600 h-16 w-16 rounded-3xl flex items-center justify-center text-3xl mx-auto shadow-sm">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>
                <div>
                    <h2 class="font-extrabold text-base text-gray-800">Điểm Danh Tháng ${currentMonth}/${currentYear}</h2>
                    <p class="text-xs text-gray-400 mt-0.5">Số ngày bé có mặt tại lớp theo dữ liệu hệ thống</p>
                </div>
                <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl inline-block w-full">
                    <p class="text-xs font-bold text-emerald-800 uppercase">Tổng số ngày đi học</p>
                    <h3 class="text-3xl font-black text-emerald-700 mt-1">${records.length} ngày</h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 space-y-3">
                <h3 class="font-extrabold text-xs text-gray-700 uppercase tracking-wide">Chi tiết lịch sử điểm danh</h3>
                <div class="space-y-2 max-h-60 overflow-y-auto">
                    ${records.length > 0 ? records.map(rec => `
                        <div class="bg-emerald-50/50 p-3 rounded-2xl border border-emerald-100 flex justify-between items-center text-xs">
                            <span class="font-bold text-gray-800"><i class="fa-solid fa-check text-emerald-600 mr-2"></i> Ngày ${rec.date.split('-').reverse().join('/')}</span>
                            <span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-bold text-[10px]">Có mặt</span>
                        </div>
                    `).join('') : '<p class="text-xs text-gray-400 text-center py-4">Chưa có dữ liệu điểm danh tháng này.</p>'}
                </div>
            </div>
        `;
    }

   // --- 4. TAB HỌC PHÍ & LỊCH SỬ ĐÓNG TIỀN (ĐÃ ĐỒNG BỘ CHUẨN VỚI ADMIN) ---
    function renderTuitionTab(container) {
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth() + 1;
        
        const classesList = appDatabase.classesList || [];
        const assignedClass = classesList.find(c => c.name === currentStudent.className);
        const baseFee = assignedClass ? (parseFloat(assignedClass.tuitionFee) || 2500000) : 2500000;
        
        const discountValue = Number(currentStudent.discountValue || 0);
        const discountType = currentStudent.discountType || 'Không';
        
        let calculatedFee = baseFee;
        if (discountType !== 'Không' && discountValue > 0) {
            if (currentStudent.discountUnit === 'percent') {
                calculatedFee = baseFee - (baseFee * discountValue / 100);
            } else {
                calculatedFee = baseFee - discountValue;
            }
        }
        if (calculatedFee < 0) calculatedFee = 0;

        // Xử lý linh hoạt mảng hoặc object danh sách hóa đơn từ Admin
        let rawInvoices = appDatabase.tuitionInvoices || [];
        const invoicesList = Array.isArray(rawInvoices) ? rawInvoices : Object.values(rawInvoices);
        
        const monthCodeStr = `${currentYear}${String(currentMonth).padStart(2,'0')}`;
        
        // Dò tìm phiếu thu của đúng học sinh này dựa vào nhiều điều kiện để khớp tuyệt đối với Admin
        const invoice = invoicesList.find(inv => {
            const matchMonth = (inv.invoiceId && inv.invoiceId.includes(monthCodeStr)) || (inv.month && Number(inv.month) === currentMonth);
            const matchStudent = (inv.studentCode && currentStudent.code && inv.studentCode.trim() === currentStudent.code.trim()) || 
                                 (inv.studentName && currentStudent.name && inv.studentName.trim().toLowerCase() === currentStudent.name.trim().toLowerCase());
            return matchMonth && matchStudent;
        });

        const invoiceId = invoice ? invoice.invoiceId : `INV-${monthCodeStr}-${currentStudent.code || '01'}`;
        
        let mealFee = 500000;
        let carriedDebt = invoice ? (parseFloat(invoice.carriedOverDebt) || 0) : 0;
        
        // Lấy tổng phải đóng do Admin đã ấn định, nếu chưa có thì tính mặc định
        let totalPayable = invoice ? (parseFloat(invoice.totalPayable) || (calculatedFee + mealFee)) : (calculatedFee + mealFee);
        let totalNeeded = totalPayable + carriedDebt;

        // Lấy danh sách lịch sử thanh toán (payments) do Admin đã cập nhật
        let paymentsList = invoice && invoice.payments ? (Array.isArray(invoice.payments) ? invoice.payments : Object.values(invoice.payments)) : [];
        let totalPaid = paymentsList.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
        
        let remainingAmount = totalNeeded - totalPaid;
        if (remainingAmount < 0) remainingAmount = 0;
        let isPaid = remainingAmount <= 0;

        const activeBank = appDatabase.schoolBankConfig || { bankId: "BIDV", accountNo: "6320459459", accountName: "TRAN VU LUC" };
        const transferContent = `${currentStudent.name} Thang ${currentMonth} ${invoiceId}`;
        
        const qrCleanAccount = activeBank.accountNo.trim();
        const qrCleanBankId = activeBank.bankId.trim();
        const qrUrl = `https://img.vietqr.io/image/${qrCleanBankId}-${qrCleanAccount}-compact2.png?amount=${remainingAmount}&addInfo=${encodeURIComponent(transferContent)}&accountName=${encodeURIComponent(activeBank.accountName)}`;

        container.innerHTML = `
            <div class="space-y-4 text-xs">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 space-y-3">
                    <div class="flex justify-between items-center border-b border-orange-100 pb-3">
                        <div>
                            <h2 class="font-extrabold text-sm text-gray-800 uppercase"><i class="fa-solid fa-file-invoice-dollar mr-1 text-orange-500"></i> Học Phí Tháng ${currentMonth}/${currentYear}</h2>
                            <p class="text-[10px] text-gray-400 font-mono mt-0.5">Mã phiếu thu: ${invoiceId}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-black ${isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                            ${isPaid ? 'ĐÃ ĐÓNG ĐỦ' : 'CHƯA ĐÓNG ĐỦ'}
                        </span>
                    </div>

                    <div class="space-y-2 divide-y divide-gray-100">
                        <div class="flex justify-between pt-1">
                            <span class="text-gray-600">Học phí định mức lớp:</span>
                            <span class="font-mono font-bold">${baseFee.toLocaleString()}đ</span>
                        </div>
                        <div class="flex justify-between pt-2">
                            <span class="text-gray-600">Ưu đãi (${discountType}):</span>
                            <span class="font-mono font-bold text-orange-600">-${(baseFee - calculatedFee).toLocaleString()}đ</span>
                        </div>
                        <div class="flex justify-between pt-2">
                            <span class="text-gray-600">Tiền ăn bán trú:</span>
                            <span class="font-mono font-bold">${mealFee.toLocaleString()}đ</span>
                        </div>
                        ${carriedDebt > 0 ? `
                        <div class="flex justify-between pt-2 text-rose-600 font-bold">
                            <span>Nợ cũ chuyển sang:</span>
                            <span class="font-mono">+${carriedDebt.toLocaleString()}đ</span>
                        </div>` : ''}
                        <div class="flex justify-between pt-2 font-bold text-gray-700">
                            <span>Tổng phải đóng:</span>
                            <span class="font-mono">${totalNeeded.toLocaleString()}đ</span>
                        </div>
                        <div class="flex justify-between pt-2 font-bold text-emerald-600">
                            <span>Đã thanh toán (Admin cập nhật):</span>
                            <span class="font-mono">-${totalPaid.toLocaleString()}đ</span>
                        </div>
                        <div class="flex justify-between pt-3 font-black text-sm text-rose-600 bg-rose-50/60 p-3 rounded-2xl border border-rose-100">
                            <span>CÒN LẠI CẦN ĐÓNG:</span>
                            <span class="font-mono">${remainingAmount.toLocaleString()}đ</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 text-center space-y-3">
                    <h3 class="font-black text-orange-600 uppercase text-xs"><i class="fa-solid fa-qrcode mr-1"></i> Mã QR Chuyển Khoản Nhanh</h3>
                    <p class="text-[11px] text-gray-500">Quét mã QR bằng ứng dụng Ngân hàng để thanh toán chính xác số tiền và nội dung.</p>
                    
                    <div class="flex justify-center my-2">
                        <div class="bg-white p-3 rounded-2xl border-2 border-orange-200 shadow-sm inline-block">
                            <img src="${qrUrl}" alt="Mã QR Chuyển Khoản Học Phí" class="h-40 w-40 object-contain mx-auto rounded-lg">
                        </div>
                    </div>

                    <div class="bg-orange-50/70 p-3 rounded-2xl border border-orange-200 text-left space-y-1">
                        <div class="flex justify-between"><span class="text-gray-500">Ngân hàng:</span> <b class="text-gray-800">${activeBank.bankId}</b></div>
                        <div class="flex justify-between"><span class="text-gray-500">Số tài khoản:</span> <b class="font-mono text-emerald-700 font-bold text-sm">${activeBank.accountNo}</b></div>
                        <div class="flex justify-between"><span class="text-gray-500">Chủ tài khoản:</span> <b class="text-gray-800">${activeBank.accountName}</b></div>
                        <div class="flex justify-between"><span class="text-gray-500">Số tiền:</span> <b class="font-mono text-rose-600 font-bold">${remainingAmount.toLocaleString()}đ</b></div>
                        <div class="pt-1 border-t border-orange-200/60 mt-1">
                            <span class="text-gray-500 block text-[10px]">Nội dung chuyển khoản (bắt buộc):</span>
                            <div class="bg-white p-2 rounded-xl border border-orange-300 font-mono text-indigo-700 font-bold text-center mt-1 select-all">${transferContent}</div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 space-y-3">
                    <h3 class="font-black text-gray-700 uppercase text-xs"><i class="fa-solid fa-clock-rotate-left mr-1 text-emerald-600"></i> Lịch Sử Đóng Tiền</h3>
                    <div class="space-y-2 max-h-48 overflow-y-auto">
                        ${paymentsList.length > 0 ? paymentsList.map((p, index) => `
                            <div class="bg-emerald-50/60 p-3 rounded-2xl border border-emerald-100 flex justify-between items-center">
                                <div>
                                    <span class="font-bold text-gray-800 block">Lần ${index + 1}: +${(parseFloat(p.amount) || 0).toLocaleString()}đ</span>
                                    <span class="text-[10px] text-gray-400 font-mono"><i class="fa-regular fa-calendar mr-1"></i> ${p.date || '---'} | ${p.method || 'Chuyển khoản'}</span>
                                </div>
                                <span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-bold text-[10px]">Thành công</span>
                            </div>
                        `).join('') : '<p class="text-xs text-gray-400 text-center py-4 bg-gray-50 rounded-2xl">Chưa có giao dịch thanh toán nào được ghi nhận từ Admin.</p>'}
                    </div>
                </div>
            </div>
        `;
    }

    // --- 5. TAB GÓC HỌC TIẾNG ANH (100 CÂU - XÁO TRỘN NGẪU NHIÊN) ---
    let englishQuestions = [];
    let currentQuizIndex = 0;
    let score = 0;

    function initEnglishQuiz() {
        const vocabList = [
            { en: "Apple", vi: "Quả táo", emoji: "🍎" }, { en: "Banana", vi: "Quả chuối", emoji: "🍌" },
            { en: "Cat", vi: "Con mèo", emoji: "🐱" }, { en: "Dog", vi: "Con chó", emoji: "🐶" },
            { en: "Milk", vi: "Sữa", emoji: "🥛" }, { en: "Water", vi: "Nước", emoji: "💧" },
            { en: "Sun", vi: "Mặt trời", emoji: "☀️" }, { en: "Moon", vi: "Mặt trăng", emoji: "🌙" },
            { en: "Book", vi: "Quyển sách", emoji: "📖" }, { en: "Ball", vi: "Quả bóng", emoji: "⚽" },
            { en: "Fish", vi: "Con cá", emoji: "🐟" }, { en: "Bird", vi: "Con chim", emoji: "🐦" },
            { en: "Car", vi: "Xe hơi", emoji: "🚗" }, { en: "Tree", vi: "Cây xanh", emoji: "🌳" },
            { en: "Flower", vi: "Bông hoa", emoji: "🌸" }, { en: "Star", vi: "Ngôi sao", emoji: "⭐" },
            { en: "House", vi: "Ngôi nhà", emoji: "🏠" }, { en: "Hat", vi: "Cái nón", emoji: "👒" },
            { en: "Shirt", vi: "Áo sơ mi", emoji: "👕" }, { en: "Cake", vi: "Bánh ngọt", emoji: "🎂" }
        ];

        let rawQuestions = [];
        for (let i = 1; i <= 100; i++) {
            const correct = vocabList[(i - 1) % vocabList.length];
            let wrongs = vocabList.filter(v => v.en !== correct.en)
                                  .sort(() => 0.5 - Math.random())
                                  .slice(0, 3);
            let options = [...wrongs, correct].sort(() => 0.5 - Math.random());
            
            rawQuestions.push({
                id: i,
                question: `Lắng nghe và chọn hình ảnh đúng cho từ: "${correct.en}" (${correct.vi})`,
                correctAnswer: correct.en,
                correctEmoji: correct.emoji,
                options: options.map(o => ({ en: o.en, emoji: o.emoji }))
            });
        }

        englishQuestions = rawQuestions.sort(() => Math.random() - 0.5);
        currentQuizIndex = 0;
        score = 0;
    }

    function renderEnglishTab(container) {
        if (englishQuestions.length === 0) {
            initEnglishQuiz();
        }

        const q = englishQuestions[currentQuizIndex];

        container.innerHTML = `
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-emerald-100 space-y-4 text-center">
                <div class="flex justify-between items-center text-xs font-bold text-gray-400">
                    <span>Trò chơi 100 từ vựng (Xáo trộn ngẫu nhiên)</span>
                    <span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-mono">Câu ${currentQuizIndex + 1}/100</span>
                </div>

                <div class="bg-gradient-to-br from-orange-500 to-emerald-600 text-white p-6 rounded-3xl shadow-md space-y-3">
                    <div class="bg-white/20 h-20 w-20 rounded-full flex items-center justify-center text-4xl mx-auto backdrop-blur-sm shadow-inner cursor-pointer animate-pulse" onclick="speakWord('${q.correctAnswer}')">
                        <i class="fa-solid fa-volume-high text-white"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-sm leading-snug">Bé hãy bấm nghe âm thanh và chọn hình ảnh tương ứng nhé!</h3>
                        <p class="text-[11px] text-orange-100 mt-1">Điểm số hiện tại: <b class="text-white">${score}</b></p>
                    </div>
                    <button onclick="speakWord('${q.correctAnswer}')" class="bg-white text-orange-600 px-4 py-1.5 rounded-xl text-xs font-black transition shadow-sm hover:bg-orange-50">
                        <i class="fa-solid fa-play mr-1"></i> Nghe lại phát âm
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    ${q.options.map(opt => `
                        <button onclick="checkAnswerImage('${opt.en}', '${q.correctAnswer}')" class="bg-orange-50/70 hover:bg-orange-100 border-2 border-orange-200 text-gray-800 p-4 rounded-3xl transition shadow-xs active:scale-95 flex flex-col items-center justify-center space-y-1 group">
                            <span class="text-5xl group-hover:scale-110 transition transform duration-200">${opt.emoji}</span>
                            <span class="text-xs font-bold text-gray-600">${opt.en}</span>
                        </button>
                    `).join('')}
                </div>

                <div class="flex justify-between pt-3 text-xs border-t border-gray-100">
                    <button onclick="prevQuestion()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-xl font-bold transition"><i class="fa-solid fa-arrow-left mr-1"></i> Câu trước</button>
                    <button onclick="restartQuiz()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-xl font-bold transition" title="Trộn lại câu hỏi"><i class="fa-solid fa-shuffle mr-1"></i> Trộn lại</button>
                    <button onclick="nextQuestion()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold transition">Câu tiếp <i class="fa-solid fa-arrow-right ml-1"></i></button>
                </div>
            </div>
        `;
        
        setTimeout(() => speakWord(q.correctAnswer), 300);
    }

    function speakWord(word) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        }
    }

    function checkAnswerImage(selectedEn, correctEn) {
        if (selectedEn === correctEn) {
            score++;
            alert("🎉 Chính xác! Bé chọn hình đúng rồi!");
            nextQuestion();
        } else {
            alert("❌ Chưa đúng rồi bé ơi, hãy nghe lại âm thanh và chọn hình khác nhé!");
            speakWord(correctEn);
        }
    }

    function nextQuestion() {
        if (currentQuizIndex < englishQuestions.length - 1) {
            currentQuizIndex++;
        } else {
            alert(`🎉 Chúc mừng bé đã hoàn thành xuất sắc 100 câu hỏi! Tổng điểm: ${score}/100. Hệ thống sẽ xáo trộn lại bộ câu hỏi mới cho bé.`);
            initEnglishQuiz();
        }
        renderEnglishTab(document.getElementById('main-content'));
    }

    function prevQuestion() {
        if (currentQuizIndex > 0) {
            currentQuizIndex--;
        } else {
            currentQuizIndex = englishQuestions.length - 1;
        }
        renderEnglishTab(document.getElementById('main-content'));
    }

    function restartQuiz() {
        alert("🔀 Đã xáo trộn lại toàn bộ 100 câu hỏi ngẫu nhiên cho bé!");
        initEnglishQuiz();
        renderEnglishTab(document.getElementById('main-content'));
    }

    // --- HỆ THỐNG XÁC NHẬN ĐĂNG XUẤT & PHÁO HOA ---
    function handleLogout() {
        const studentName = currentStudent && currentStudent.name ? currentStudent.name : 'Bé yêu';
        
        const modalId = 'logout-confirm-modal';
        let existingModal = document.getElementById(modalId);
        if (existingModal) existingModal.remove();

        const modalHtml = `
            <div id="${modalId}" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 animate-fade-in">
                <div class="bg-white w-full max-w-xs rounded-[32px] p-6 text-center shadow-2xl border border-orange-100 space-y-4 transform scale-100 transition-all">
                    <div class="bg-orange-100 text-orange-600 h-16 w-16 rounded-3xl flex items-center justify-center text-3xl mx-auto shadow-inner">
                        <i class="fa-solid fa-person-walking-dashed-line-arrow-right"></i>
                    </div>
                    <div class="space-y-1">
                        <h3 class="font-black text-base text-gray-800">Xác nhận đăng xuất</h3>
                        <p class="text-xs text-gray-500">Bé <b class="text-orange-600">${studentName}</b> có chắc chắn muốn rời khỏi cổng học sinh không?</p>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-2">
                        <button onclick="closeLogoutModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 px-4 rounded-2xl font-bold text-xs transition">
                            Ở lại học tiếp
                        </button>
                        <button onclick="executeLogout('${studentName}')" class="bg-gradient-to-r from-orange-500 to-emerald-600 hover:opacity-90 text-white py-2.5 px-4 rounded-2xl font-bold text-xs shadow-md transition">
                            Đăng xuất
                        </button>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function closeLogoutModal() {
        const modal = document.getElementById('logout-confirm-modal');
        if (modal) modal.remove();
    }

    function executeLogout(studentName) {
        closeLogoutModal();

        if (!window.confetti) {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js';
            script.onload = () => triggerFireworksAndRedirect(studentName);
            document.head.appendChild(script);
        } else {
            triggerFireworksAndRedirect(studentName);
        }
    }

    function triggerFireworksAndRedirect(studentName) {
        const alertBox = document.createElement('div');
        alertBox.className = 'fixed inset-x-4 top-10 z-50 bg-gradient-to-r from-orange-500 to-emerald-600 text-white p-4 rounded-3xl shadow-2xl text-center space-y-1 animate-bounce';
        alertBox.innerHTML = `
            <h4 class="font-black text-sm">Tạm biệt bé ${studentName}! ❤️</h4>
            <p class="text-[11px] text-orange-100">Chúc bé luôn chăm ngoan, học giỏi nhé!</p>
        `;
        document.body.appendChild(alertBox);

        const duration = 2.5 * 1000;
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        const interval = setInterval(function() {
            const timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) {
                return clearInterval(interval);
            }
            const particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);

        setTimeout(() => {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }, 2500);
    }
</script>
