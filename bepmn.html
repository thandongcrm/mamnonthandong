<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thần Đồng Siêu Nhí - Cổng Nhân Viên Bếp</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFF7ED; }
        .mobile-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FFFBF5; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: relative; }
    </style>
</head>
<body class="text-gray-800">

    <div class="mobile-container">
        
        <!-- HEADER THÔNG TIN NHÂN SỰ -->
        <header class="bg-gradient-to-r from-orange-500 to-amber-600 text-white p-5 rounded-b-[30px] shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-3">
                    <div class="bg-white/20 p-2.5 rounded-2xl text-xl backdrop-blur-sm">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <div>
                        <h1 id="staff-name-display" class="font-black text-lg leading-tight">Nhân Viên Bếp</h1>
                        <p class="text-xs text-orange-100 font-semibold" id="staff-code-display">Mã: KB001</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition backdrop-blur-sm">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
                </button>
            </div>

            <!-- MENU TAB ĐIỀU HƯỚNG DI ĐỘNG -->
            <div class="grid grid-cols-4 gap-1.5 pt-2 border-t border-orange-400/40 text-center">
                <button onclick="switchTab('profile')" id="tab-btn-profile" class="py-2 px-1 rounded-xl text-[11px] font-bold bg-white text-orange-600 shadow-sm transition">
                    <i class="fa-solid fa-user text-xs block mb-0.5"></i> Hồ Sơ
                </button>
                <button onclick="switchTab('expense')" id="tab-btn-expense" class="py-2 px-1 rounded-xl text-[11px] font-bold text-white/90 hover:bg-orange-600/50 transition">
                    <i class="fa-solid fa-receipt text-xs block mb-0.5"></i> Nhập Bếp
                </button>
                <button onclick="switchTab('attendance')" id="tab-btn-attendance" class="py-2 px-1 rounded-xl text-[11px] font-bold text-white/90 hover:bg-orange-600/50 transition">
                    <i class="fa-solid fa-calendar-check text-xs block mb-0.5"></i> Chấm Công
                </button>
                <button onclick="switchTab('salary')" id="tab-btn-salary" class="py-2 px-1 rounded-xl text-[11px] font-bold text-white/90 hover:bg-orange-600/50 transition">
                    <i class="fa-solid fa-file-invoice-dollar text-xs block mb-0.5"></i> Lương
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT CONTAINER -->
        <main class="flex-1 p-4 space-y-4 overflow-y-auto pb-20" id="main-content">
            <!-- Dữ liệu render động bằng JS -->
        </main>

        <!-- FOOTER COPYRIGHT -->
        <footer class="py-3 text-center text-[10px] text-gray-400 border-t border-orange-100 bg-white/60">
            Hệ thống Quản lý Mầm Non Thần Đồng Siêu Nhí
        </footer>
    </div>

<script>
    let currentStaff = null;
    let appDatabase = {};

    window.onload = async function() {
        // Tải dữ liệu trực tiếp từ Firebase Firestore lên mây
        try {
            if (typeof firebase !== 'undefined' && firebase.firestore) {
                const docSnap = await firebase.firestore().collection("schoolSystem").doc("than_dong_sieu_nhi_main").get();
                if (docSnap.exists) {
                    appDatabase = docSnap.data();
                } else {
                    appDatabase = JSON.parse(localStorage.getItem('than_dong_sieu_nhi_db')) || {};
                }
            } else {
                appDatabase = JSON.parse(localStorage.getItem('than_dong_sieu_nhi_db')) || {};
            }
        } catch (e) {
            console.error("Lỗi tải dữ liệu:", e);
            appDatabase = JSON.parse(localStorage.getItem('than_dong_sieu_nhi_db')) || {};
        }

        const storedUser = localStorage.getItem('currentUser');
        if (storedUser) {
            currentStaff = JSON.parse(storedUser);
        } else {
            const list = appDatabase.kitchenStaff || [];
            currentStaff = list.length > 0 ? list[0] : { code: 'KB001', name: 'Trần Văn Bình', role: 'bep', email: 'binhtv@thandong.com' };
        }

        document.getElementById('staff-name-display').innerText = currentStaff.name || 'Nhân Viên Bếp';
        document.getElementById('staff-code-display').innerText = `Mã: ${currentStaff.code || 'KB001'}`;

        switchTab('profile');
    };

    function switchTab(tabKey) {
        ['profile', 'expense', 'attendance', 'salary'].forEach(t => {
            const btn = document.getElementById(`tab-btn-${t}`);
            if (t === tabKey) {
                btn.className = "py-2 px-1 rounded-xl text-[11px] font-extrabold bg-white text-orange-600 shadow-md transition transform scale-105";
            } else {
                btn.className = "py-2 px-1 rounded-xl text-[11px] font-bold text-white/90 hover:bg-orange-600/50 transition";
            }
        });

        const container = document.getElementById('main-content');
        appDatabase = JSON.parse(localStorage.getItem('than_dong_sieu_nhi_db')) || {};

        const freshStaff = (appDatabase.kitchenStaff || []).find(k => k.code === currentStaff.code || k.email === currentStaff.email);
        if (freshStaff) currentStaff = freshStaff;

        if (tabKey === 'profile') renderProfileTab(container);
        else if (tabKey === 'expense') renderExpenseTab(container);
        else if (tabKey === 'attendance') renderAttendanceTab(container);
        else if (tabKey === 'salary') renderSalaryTab(container);
    }

    // --- 1. TAB HỒ SƠ CÁ NHÂN ---
    function renderProfileTab(container) {
        const latestContract = currentStaff.contracts && currentStaff.contracts.length > 0 ? currentStaff.contracts[currentStaff.contracts.length - 1] : { no: 'Chưa có', from: '---', to: '---', salary: 0 };
        
        container.innerHTML = `
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 space-y-4">
                <div class="flex items-center space-x-3 border-b border-orange-100 pb-3">
                    <div class="bg-orange-100 text-orange-600 h-12 w-12 rounded-2xl flex items-center justify-center font-bold text-xl shadow-xs">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <div>
                        <h2 class="font-extrabold text-base text-gray-800">${currentStaff.name}</h2>
                        <p class="text-xs text-orange-600 font-semibold">Nhân viên chế biến bán trú</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="bg-orange-50/50 p-3 rounded-2xl border border-orange-100">
                        <p class="text-gray-400 font-bold text-[10px] uppercase">Ngày sinh</p>
                        <p class="font-extrabold text-gray-800 mt-0.5">${currentStaff.dob || '---'}</p>
                    </div>
                    <div class="bg-orange-50/50 p-3 rounded-2xl border border-orange-100">
                        <p class="text-gray-400 font-bold text-[10px] uppercase">Giới tính</p>
                        <p class="font-extrabold text-gray-800 mt-0.5">${currentStaff.gender || 'Nam'}</p>
                    </div>
                    <div class="bg-orange-50/50 p-3 rounded-2xl border border-orange-100">
                        <p class="text-gray-400 font-bold text-[10px] uppercase">Số điện thoại</p>
                        <p class="font-extrabold text-gray-800 mt-0.5">${currentStaff.phone || '---'}</p>
                    </div>
                    <div class="bg-orange-50/50 p-3 rounded-2xl border border-orange-100">
                        <p class="text-gray-400 font-bold text-[10px] uppercase">Số CCCD</p>
                        <p class="font-extrabold text-gray-800 mt-0.5">${currentStaff.cccd || '---'}</p>
                    </div>
                </div>

                <div class="bg-amber-50/60 p-3.5 rounded-2xl border border-amber-200 text-xs space-y-1">
                    <p class="text-amber-900 font-bold"><i class="fa-solid fa-envelope mr-1 text-orange-500"></i> Email: <span class="font-mono text-teal-700">${currentStaff.email}</span></p>
                    <p class="text-amber-900 font-bold"><i class="fa-solid fa-location-dot mr-1 text-orange-500"></i> Địa chỉ: <span class="font-normal text-gray-700">${currentStaff.address || '---'}</span></p>
                </div>

                <div class="bg-emerald-50/60 p-4 rounded-2xl border border-emerald-200 space-y-2">
                    <h3 class="text-xs font-black text-emerald-900 uppercase"><i class="fa-solid fa-file-contract mr-1"></i> Hợp Đồng Lao Động Hiện Tại</h3>
                    <div class="text-xs space-y-1 text-gray-700">
                        <p>Số HĐ: <b class="text-emerald-800">${latestContract.no}</b></p>
                        <p>Hiệu lực: Từ <b>${latestContract.from}</b> đến <b>${latestContract.to}</b></p>
                        <p>Mức lương cơ bản: <b class="text-emerald-700 font-mono">${Number(latestContract.salary || 0).toLocaleString('vi-VN')} VNĐ</b></p>
                    </div>
                </div>
            </div>
        `;
    }

    // --- 2. TAB NHẬP CHI BẾP (NHÓM THEO NGÀY & TỔNG TIỀN TRONG NGÀY) ---
    function renderExpenseTab(container) {
        const todayStr = new Date().toISOString().split('T')[0];
        const expenses = (appDatabase.kitchenExpenses || []).filter(item => item.staffName === currentStaff.name);

        // Nhóm các khoản chi theo ngày (date)
        const groupedByDate = {};
        expenses.forEach(ex => {
            if (!groupedByDate[ex.date]) {
                groupedByDate[ex.date] = [];
            }
            groupedByDate[ex.date].push(ex);
        });

        // Sắp xếp ngày giảm dần (mới nhất lên trên)
        const sortedDates = Object.keys(groupedByDate).sort().reverse();

        let historyHtml = '';
        if (sortedDates.length > 0) {
            sortedDates.forEach(dateStr => {
                const dayItems = groupedByDate[dateStr];
                const totalDayAmount = dayItems.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
                const formattedDate = dateStr.split('-').reverse().join('/');

                historyHtml += `
                    <div class="bg-orange-50/50 border border-orange-200 rounded-2xl p-3 space-y-2">
                        <!-- HEADER NGÀY & TỔNG TIỀN TRONG NGÀY -->
                        <div class="flex justify-between items-center border-b border-orange-200/60 pb-2">
                            <span class="font-extrabold text-xs text-orange-900"><i class="fa-solid fa-calendar-day mr-1.5 text-orange-500"></i> Ngày ${formattedDate}</span>
                            <span class="bg-amber-100 text-amber-900 px-2.5 py-0.5 rounded-full font-black text-xs font-mono shadow-xs">
                                Tổng: ${totalDayAmount.toLocaleString('vi-VN')}đ
                            </span>
                        </div>

                        <!-- DANH SÁCH MÓN HÀNG TRONG NGÀY -->
                        <div class="space-y-1.5">
                            ${dayItems.map(ex => `
                                <div class="bg-white p-2.5 rounded-xl border border-orange-100 flex justify-between items-center text-xs shadow-2xs">
                                    <span class="font-bold text-gray-700">${ex.itemName}</span>
                                    <div class="flex items-center space-x-2">
                                        <span class="font-mono font-bold text-emerald-700">${Number(ex.amount || 0).toLocaleString('vi-VN')}đ</span>
                                        <button onclick="deleteKitchenExpense('${ex.id}')" class="text-rose-400 hover:text-rose-600 p-1" title="Xóa"><i class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
        } else {
            historyHtml = '<p class="text-xs text-gray-400 text-center py-4">Chưa có khoản chi nào được nhập.</p>';
        }

        container.innerHTML = `
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 space-y-4">
                <h2 class="font-extrabold text-sm text-gray-800 uppercase tracking-wide"><i class="fa-solid fa-receipt mr-1.5 text-orange-500"></i> Nhập Khoản Chi Bếp Hàng Ngày</h2>
                
                <form onsubmit="saveKitchenExpenseItem(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Ngày mua *</label>
                        <input type="date" id="ke-date" value="${todayStr}" required class="w-full p-3 bg-orange-50/40 border border-orange-200 rounded-2xl text-sm font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Tên thực phẩm / Hàng hóa *</label>
                        <input type="text" id="ke-item" required placeholder="VD: Thịt heo, rau củ tươi..." class="w-full p-3 bg-white border border-orange-200 rounded-2xl text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Số tiền (VNĐ) *</label>
                        <input type="number" id="ke-amount" required placeholder="VD: 1500000" class="w-full p-3 bg-white border border-orange-200 rounded-2xl text-sm font-bold text-emerald-700 font-mono">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 text-white p-3 rounded-2xl text-sm font-bold shadow-md transition">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> Lưu & Đồng Bộ Về Admin
                    </button>
                </form>
            </div>

            <!-- LỊCH SỬ KHOẢN CHI GOM THEO NGÀY -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 space-y-3">
                <h3 class="font-extrabold text-xs text-gray-700 uppercase tracking-wide">Lịch sử khoản chi theo ngày</h3>
                <div class="space-y-3 max-h-80 overflow-y-auto pr-1">
                    ${historyHtml}
                </div>
            </div>
        `;
    }

   async function saveKitchenExpenseItem(e) {
        e.preventDefault();
        
        // Cập nhật lại appDatabase mới nhất từ mây/máy trước khi push
        try {
            if (typeof firebase !== 'undefined' && firebase.firestore) {
                const docSnap = await firebase.firestore().collection("schoolSystem").doc("than_dong_sieu_nhi_main").get();
                if (docSnap.exists) appDatabase = docSnap.data();
            }
        } catch (err) {}

        if (!appDatabase.kitchenExpenses) appDatabase.kitchenExpenses = [];

        const date = document.getElementById('ke-date').value;
        const itemName = document.getElementById('ke-item').value.trim();
        const amount = parseFloat(document.getElementById('ke-amount').value) || 0;
        const staffName = currentStaff.name;

        const newItem = {
            id: "KE" + Date.now(),
            date,
            itemName,
            amount,
            staffName
        };

        appDatabase.kitchenExpenses.push(newItem);

        // Lưu đồng thời lên localStorage và Firebase Firestore
        localStorage.setItem('than_dong_sieu_nhi_db', JSON.stringify(appDatabase));
        if (typeof firebase !== 'undefined' && firebase.firestore) {
            await firebase.firestore().collection("schoolSystem").doc("than_dong_sieu_nhi_main").set(appDatabase);
        }

        alert("Đã lưu và đồng bộ khoản chi bếp về trang quản trị Admin thành công!");
        e.target.reset();
        document.getElementById('ke-date').value = new Date().toISOString().split('T')[0];
        switchTab('expense');
    }

   async function deleteKitchenExpense(id) {
        if (confirm("Xác nhận xóa khoản chi bếp này?")) {
            try {
                if (typeof firebase !== 'undefined' && firebase.firestore) {
                    const docSnap = await firebase.firestore().collection("schoolSystem").doc("than_dong_sieu_nhi_main").get();
                    if (docSnap.exists) appDatabase = docSnap.data();
                }
            } catch (err) {}

            if (appDatabase.kitchenExpenses) {
                appDatabase.kitchenExpenses = appDatabase.kitchenExpenses.filter(item => item.id !== id);
                
                localStorage.setItem('than_dong_sieu_nhi_db', JSON.stringify(appDatabase));
                if (typeof firebase !== 'undefined' && firebase.firestore) {
                    await firebase.firestore().collection("schoolSystem").doc("than_dong_sieu_nhi_main").set(appDatabase);
                }
                switchTab('expense');
            }
        }
    }

    // --- 3. TAB CHẤM CÔNG ---
    function renderAttendanceTab(container) {
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth() + 1;

        container.innerHTML = `
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 space-y-4">
                <div class="flex justify-between items-center border-b border-orange-100 pb-3">
                    <h2 class="font-extrabold text-sm text-gray-800 uppercase tracking-wide"><i class="fa-solid fa-calendar-check mr-1.5 text-emerald-600"></i> Bảng Chấm Công Cá Nhân</h2>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-0.5">Năm</label>
                        <select id="att-filter-year" onchange="buildAttendanceCalendarDays()" class="w-full p-2.5 bg-orange-50 border border-orange-200 rounded-xl text-xs font-bold">
                            ${Array.from({length: 6}, (_, i) => 2025 + i).map(y => `<option value="${y}" ${y === currentYear ? 'selected' : ''}>Năm ${y}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-0.5">Tháng</label>
                        <select id="att-filter-month" onchange="buildAttendanceCalendarDays()" class="w-full p-2.5 bg-orange-50 border border-orange-200 rounded-xl text-xs font-bold">
                            ${Array.from({length: 12}, (_, i) => `<option value="${i+1}" ${i+1 === currentMonth ? 'selected' : ''}>Tháng ${i+1}</option>`).join('')}
                        </select>
                    </div>
                </div>

                <div id="attendance-calendar-grid" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
            </div>
        `;
        buildAttendanceCalendarDays();
    }

    function buildAttendanceCalendarDays() {
        const year = parseInt(document.getElementById('att-filter-year').value);
        const month = parseInt(document.getElementById('att-filter-month').value);
        const gridContainer = document.getElementById('attendance-calendar-grid');

        const daysInMonth = new Date(year, month, 0).getDate();
        const dayNamesFull = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

        appDatabase = JSON.parse(localStorage.getItem('than_dong_sieu_nhi_db')) || { attendanceRecords: [] };
        if (!appDatabase.attendanceRecords) appDatabase.attendanceRecords = [];

        let daysHtml = '';
        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(year, month - 1, d);
            const dayOfWeek = dayNamesFull[dateObj.getDay()];
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

            const isChecked = appDatabase.attendanceRecords.some(r => 
                r.date === dateStr && r.staffName === currentStaff.name && (r.status === 'Present' || r.status === 'present')
            );

            daysHtml += `
                <div class="flex justify-between items-center bg-white p-3 rounded-2xl border ${isChecked ? 'border-emerald-200 bg-emerald-50/40' : 'border-orange-100'} shadow-xs">
                    <div>
                        <p class="font-bold text-gray-800 text-xs">Ngày ${d}/${month}/${year}</p>
                        <p class="text-[10px] text-gray-400 font-semibold">${dayOfWeek}</p>
                    </div>
                    <label class="flex items-center space-x-2 cursor-pointer bg-orange-50 px-3 py-1.5 rounded-xl border border-orange-200">
                        <input type="checkbox" onchange="toggleStaffAttendance('${dateStr}', this.checked)" class="rounded text-emerald-600 h-4 w-4" ${isChecked ? 'checked' : ''}>
                        <span class="text-xs font-bold text-emerald-700">Có mặt</span>
                    </label>
                </div>
            `;
        }

        gridContainer.innerHTML = daysHtml;
    }

    async function toggleStaffAttendance(dateStr, isChecked) {
        try {
            if (typeof firebase !== 'undefined' && firebase.firestore) {
                const docSnap = await firebase.firestore().collection("schoolSystem").doc("than_dong_sieu_nhi_main").get();
                if (docSnap.exists) appDatabase = docSnap.data();
            }
        } catch (err) {}

        if (!appDatabase.attendanceRecords) appDatabase.attendanceRecords = [];

        appDatabase.attendanceRecords = appDatabase.attendanceRecords.filter(r => 
            !(r.date === dateStr && r.staffName === currentStaff.name)
        );

        if (isChecked) {
            appDatabase.attendanceRecords.push({
                staffName: currentStaff.name,
                staffCode: currentStaff.code,
                date: dateStr,
                status: 'Present'
            });
        }

        localStorage.setItem('than_dong_sieu_nhi_db', JSON.stringify(appDatabase));
        if (typeof firebase !== 'undefined' && firebase.firestore) {
            await firebase.firestore().collection("schoolSystem").doc("than_dong_sieu_nhi_main").set(appDatabase);
        }
        
        buildAttendanceCalendarDays();
    }

    // --- 4. TAB BÁO CÁO LƯƠNG ---
    function renderSalaryTab(container) {
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth() + 1;
        const monthPrefix = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
        const monthKey = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;

        const latestContract = currentStaff.contracts && currentStaff.contracts.length > 0 ? currentStaff.contracts[currentStaff.contracts.length - 1] : { salary: 0 };
        const baseSalary = parseFloat(latestContract.salary) || 0;

        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        let standardDays = 0;
        for (let d = 1; d <= daysInMonth; d++) {
            const dayW = new Date(currentYear, currentMonth - 1, d).getDay();
            if (dayW >= 1 && dayW <= 6) standardDays++;
        }

        const staffCfg = appDatabase.salaryConfigs?.[monthKey]?.items?.[currentStaff.code] || { allowances: [], deductions: [], manualActualDays: null };
        const autoActualDays = (appDatabase.attendanceRecords || []).filter(r => r.date && r.date.startsWith(monthPrefix) && r.staffName === currentStaff.name && r.status === 'Present').length;
        const actualDays = staffCfg.manualActualDays !== null && staffCfg.manualActualDays !== undefined ? staffCfg.manualActualDays : autoActualDays;

        let monthlySalary = 0;
        if (actualDays > 0 && standardDays > 0) {
            monthlySalary = Math.round((baseSalary / standardDays) * actualDays);
        }

        const totalAllowances = (staffCfg.allowances || []).reduce((sum, a) => sum + (parseFloat(a.amount) || 0), 0);
        const totalDeductions = (staffCfg.deductions || []).reduce((sum, d) => sum + (parseFloat(d.amount) || 0), 0);
        const netSalary = Math.max(0, monthlySalary + totalAllowances - totalDeductions);

        container.innerHTML = `
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 space-y-4">
                <div class="flex justify-between items-center border-b border-orange-100 pb-3">
                    <div>
                        <h2 class="font-extrabold text-sm text-gray-800 uppercase"><i class="fa-solid fa-file-invoice-dollar mr-1 text-orange-500"></i> Báo Cáo Lương Tháng ${currentMonth}/${currentYear}</h2>
                    </div>
                    <button onclick="downloadMySalaryPDF('${currentStaff.code}', ${currentYear}, ${currentMonth})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition shadow-xs">
                        <i class="fa-solid fa-download mr-1"></i> Tải PDF
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="bg-orange-50/50 p-3 rounded-2xl border border-orange-100">
                        <p class="text-gray-400 font-bold text-[10px] uppercase">Công chuẩn (T2-T7)</p>
                        <p class="font-extrabold text-gray-800 mt-0.5">${standardDays} ngày</p>
                    </div>
                    <div class="bg-orange-50/50 p-3 rounded-2xl border border-orange-100">
                        <p class="text-gray-400 font-bold text-[10px] uppercase">Công thực tế</p>
                        <p class="font-extrabold text-emerald-700 mt-0.5">${actualDays} ngày</p>
                    </div>
                </div>

                <div class="space-y-2 text-xs divide-y divide-gray-100">
                    <div class="flex justify-between pt-1">
                        <span class="text-gray-600">Lương cơ bản hợp đồng:</span>
                        <span class="font-mono font-bold">${baseSalary.toLocaleString()}đ</span>
                    </div>
                    <div class="flex justify-between pt-2">
                        <span class="text-gray-600">Lương theo ngày công:</span>
                        <span class="font-mono font-bold text-orange-700">${monthlySalary.toLocaleString()}đ</span>
                    </div>
                    ${(staffCfg.allowances || []).map(a => `
                        <div class="flex justify-between pt-2 text-emerald-700">
                            <span>Phụ cấp: ${a.reason}</span>
                            <span class="font-mono font-semibold">+${parseFloat(a.amount).toLocaleString()}đ</span>
                        </div>
                    `).join('')}
                    ${(staffCfg.deductions || []).map(d => `
                        <div class="flex justify-between pt-2 text-rose-600">
                            <span>Khấu trừ: ${d.reason}</span>
                            <span class="font-mono font-semibold">-${parseFloat(d.amount).toLocaleString()}đ</span>
                        </div>
                    `).join('')}
                    <div class="flex justify-between pt-3 font-black text-sm text-indigo-700 bg-indigo-50/50 p-3 rounded-2xl">
                        <span>THỰC NHẬN:</span>
                        <span class="font-mono">${netSalary.toLocaleString()}đ</span>
                    </div>
                </div>
            </div>
        `;
    }

    function downloadMySalaryPDF(staffId, year, month) {
        const currentYear = year;
        const currentMonth = month;
        const monthKey = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
        const monthPrefix = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;

        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        let standardDays = 0;
        for (let d = 1; d <= daysInMonth; d++) {
            const dayW = new Date(currentYear, currentMonth - 1, d).getDay();
            if (dayW >= 1 && dayW <= 6) standardDays++;
        }

        const latestContract = currentStaff.contracts && currentStaff.contracts.length > 0 ? currentStaff.contracts[currentStaff.contracts.length - 1] : { salary: 0 };
        const baseSalary = parseFloat(latestContract.salary) || 0;

        const staffCfg = appDatabase.salaryConfigs?.[monthKey]?.items?.[currentStaff.code] || { allowances: [], deductions: [], manualActualDays: null };
        const autoActualDays = (appDatabase.attendanceRecords || []).filter(r => r.date && r.date.startsWith(monthPrefix) && r.staffName === currentStaff.name && r.status === 'Present').length;
        const actualDays = staffCfg.manualActualDays !== null && staffCfg.manualActualDays !== undefined ? staffCfg.manualActualDays : autoActualDays;

        let monthlySalary = 0;
        if (actualDays > 0 && standardDays > 0) {
            monthlySalary = Math.round((baseSalary / standardDays) * actualDays);
        }

        const totalAllowances = (staffCfg.allowances || []).reduce((sum, a) => sum + (parseFloat(a.amount) || 0), 0);
        const totalDeductions = (staffCfg.deductions || []).reduce((sum, d) => sum + (parseFloat(d.amount) || 0), 0);
        const netSalary = Math.max(0, monthlySalary + totalAllowances - totalDeductions);

        const pdfHtml = `
            <div class="bg-white p-6 rounded-3xl border border-gray-200 max-w-lg mx-auto space-y-4 shadow-xl" style="font-family: 'Plus Jakarta Sans', sans-serif;">
                <div class="flex justify-between items-start border-b pb-3">
                    <div>
                        <h2 class="text-base font-black text-orange-600 uppercase">Trường Mầm Non Thần Đồng</h2>
                        <p class="text-[10px] text-gray-500">Phiếu báo lương nhân viên bếp</p>
                    </div>
                    <div class="text-right">
                        <h3 class="text-xs font-bold text-gray-800">Tháng ${currentMonth}/${currentYear}</h3>
                        <p class="text-[10px] font-mono text-gray-500">Mã: ${currentStaff.code}</p>
                    </div>
                </div>
                <div class="text-xs bg-orange-50/50 p-3 rounded-2xl">
                    <p>Họ tên: <b>${currentStaff.name}</b></p>
                    <p>Ngày công thực tế: <b>${actualDays}/${standardDays} ngày</b></p>
                </div>
                <table class="w-full text-xs border-collapse">
                    <tr class="border-b"><td class="py-2">Lương cơ bản</td><td class="text-right font-mono">${baseSalary.toLocaleString()}đ</td></tr>
                    <tr class="border-b"><td class="py-2">Lương thực tế theo công</td><td class="text-right font-mono text-orange-700">${monthlySalary.toLocaleString()}đ</td></tr>
                    ${(staffCfg.allowances || []).map(a => `<tr class="border-b text-emerald-700"><td class="py-2">Phụ cấp: ${a.reason}</td><td class="text-right font-mono">+${parseFloat(a.amount).toLocaleString()}đ</td></tr>`).join('')}
                    ${(staffCfg.deductions || []).map(d => `<tr class="border-b text-rose-600"><td class="py-2">Khấu trừ: ${d.reason}</td><td class="text-right font-mono">-${parseFloat(d.amount).toLocaleString()}đ</td></tr>`).join('')}
                    <tr class="font-black text-sm text-indigo-700 bg-indigo-50"><td class="p-2.5">THỰC NHẬN</td><td class="p-2.5 text-right font-mono">${netSalary.toLocaleString()}đ</td></tr>
                </table>
            </div>
        `;

        const opt = {
            margin: 10,
            filename: `BangLuong_${currentStaff.name}_Thang${currentMonth}_${currentYear}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(pdfHtml).set(opt).save();
    }

    function handleLogout() {
        if (confirm("Xác nhận đăng xuất khỏi hệ thống?")) {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    }

</script>
